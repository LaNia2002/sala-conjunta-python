
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python colaborativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Python colaborativo</h1>
        <div class="usuario">
            <input id="nombre" placeholder="Tu nombre" maxlength="30">
            <span id="estado">Preparando Python...</span>
        </div>
    </header>

    <main>
        <section class="panel">
            <h2>Código Python</h2>

            <div id="codigo" class="editor-bloqueado"></div>

            <button id="ejecutar" disabled>
                Preparando Python...
            </button>
        </section>

        <section class="panel">
            <h2>Consola</h2>
            <pre id="salida">La salida aparecerá aquí...</pre>
            <input id="entrada" placeholder="Respuesta para input()" hidden>
            <button id="enviar" hidden>Enviar respuesta</button>
            <button id="limpiar">Limpiar consola</button>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js"></script>
    

<script type="importmap">
{
  "imports": {
    "yjs": "https://esm.sh/yjs@13.6.33",
    "y-webrtc": "https://esm.sh/y-webrtc@10.3.0?external=yjs",
    "codemirror": "https://esm.sh/codemirror@6.0.1?external=@codemirror/state,@codemirror/view,@codemirror/language",
    "y-websocket": "https://esm.sh/y-websocket@1.5.4?external=yjs",
    "@codemirror/state": "https://esm.sh/@codemirror/state@6.5.2",
    "@codemirror/view": "https://esm.sh/@codemirror/view@6.43.15?external=@codemirror/state",
    "@codemirror/language": "https://esm.sh/@codemirror/language?external=@codemirror/state,@codemirror/view",
    "@codemirror/lang-python": "https://esm.sh/@codemirror/lang-python@6.2.1?external=@codemirror/state,@codemirror/language",
    "y-codemirror.next": "https://esm.sh/y-codemirror.next@0.3.5?external=yjs,@codemirror/state,@codemirror/view"
  }
}
</script>


    <script type="module" src="script.js"></script>
</body>
</html>
